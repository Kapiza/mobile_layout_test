<!DOCTYPE html>
<html lang="ru" class="page-root">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
    <link rel="stylesheet" href="src/css/style.css">
    <link rel="stylesheet" href="src/css/3_lore.css">
    <link rel="stylesheet" href="src/css/slider.css">
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Jost:ital,wght@0,100..900;1,100..900&display=swap" rel="stylesheet">
</head>
<body class="page-body">
    <div class="wrapper">
        <!-- ===== Sidebar (desktop) ===== -->
        <aside class="sidebar">

            <div class="logo-wrapper">
                <div class="logo">
                    <span class="logo-head">
                        Grand
                        <br>
                        Universe
                    </span>
                    <span class="logo-bot">RP</span>
                </div>
            </div>

            <ul class="navigation">
                <li class="global-list-item navigation-item">
                    <a class="sidebar-item global-link" href="#">
                        <svg class="sidebar-icon">
                            <use xlink:href="src/sprite.svg#главная"></use>
                        </svg>
                        <div class="sidebar-label">
                            <span>Главная</span>
                        </div>
                    </a>
                </li>

                <li class="global-list-item navigation-item">
                    <a class="sidebar-item global-link" href="#">
                        <svg class="sidebar-icon">
                            <use xlink:href="src/sprite.svg#кредо"></use>
                        </svg>
                        <div class="sidebar-label">
                            <span>Кредо</span>
                        </div>
                    </a>
                </li>

                <li class="global-list-item navigation-item">
                    <a class="sidebar-item global-link" href="#">
                        <svg class="sidebar-icon">
                            <use xlink:href="src/sprite.svg#лор"></use>
                        </svg>
                        <div class="sidebar-label">
                            <span>Лор</span>
                        </div>
                    </a>
                </li>

                <li class="global-list-item navigation-item">
                    <a class="sidebar-item global-link" href="#">
                        <svg class="sidebar-icon">
                            <use xlink:href="src/sprite.svg#роли"></use>
                        </svg>
                        <div class="sidebar-label">
                            <span>Роли</span>
                        </div>
                    </a>
                </li>

                <li class="global-list-item navigation-item">
                    <a class="sidebar-item global-link" href="#">
                        <svg class="sidebar-icon">
                            <use xlink:href="src/sprite.svg#в-эфире"></use>
                        </svg>
                        <div class="sidebar-label">
                            <span>В ЭФире</span>
                        </div>
                    </a>
                </li>

                <li class="global-list-item navigation-item">
                    <a class="sidebar-item global-link" href="#">
                        <svg class="sidebar-icon">
                            <use xlink:href="src/sprite.svg#как-начать-играть"></use>
                        </svg>
                        <div class="sidebar-label">
                            <span>Как начать играть</span>
                        </div>
                    </a>
                </li>

                <li class="global-list-item navigation-item">
                    <a class="sidebar-item global-link" href="#">
                        <svg class="sidebar-icon">
                            <use xlink:href="src/sprite.svg#правила"></use>
                        </svg>
                        <div class="sidebar-label">
                            <span>Правила</span>
                        </div>
                    </a>
                </li>

                <li class="global-list-item navigation-item">
                    <a class="sidebar-item global-link" href="#">
                        <svg class="sidebar-icon">
                            <use xlink:href="src/sprite.svg#faq"></use>
                        </svg>
                        <div class="sidebar-label">
                            <span>FAQ</span>
                        </div>
                    </a>
                </li>
            </ul>

            <ul class="socials">
                <li class="global-list-item">
                    <a class="sidebar-item global-link socials-link" href="#">
                        <svg class="sidebar-icon">
                            <use xlink:href="src/sprite.svg#vk"></use>
                        </svg>
                        <div class="sidebar-label">
                            <span>VK</span>
                        </div>
                    </a>
                </li>

                <li class="global-list-item">
                    <a class="sidebar-item global-link socials-link" href="#">
                        <svg class="sidebar-icon">
                            <use xlink:href="src/sprite.svg#discord"></use>
                        </svg>
                        <div class="sidebar-label">
                            <span>Discord</span>
                        </div>
                    </a>
                </li>

                <li class="global-list-item">
                    <a class="sidebar-item global-link socials-link" href="#">
                        <svg class="sidebar-icon">
                            <use xlink:href="src/sprite.svg#youtube"></use>
                        </svg>
                        <div class="sidebar-label">
                            <span>YouTube</span>
                        </div>
                    </a>
                </li>

                <li class="global-list-item">
                    <a class="sidebar-item global-link socials-link" href="#">
                        <svg class="sidebar-icon">
                            <use xlink:href="src/sprite.svg#twitch"></use>
                        </svg>
                        <div class="sidebar-label">
                            <span>Twitch</span>
                        </div>
                    </a>
                </li>
            </ul>

            <div class="sidebar-footer">
                <div class="sidebar-item">
                    <div class="sidebar-icon">
                        <svg>
                            <use xlink:href="src/sprite.svg#информация"></use>
                        </svg>
                    </div>
                </div>
                <div class="sidebar-label-footer">
                    <span>
                        Grand Universe Roleplay is not
                        <br>
                        approver, sponsored, or endorsed
                        <br>
                        by Rockstar Games
                    </span>
                    <br>
                    <br>
                    <span>
                        Contact e-mail:
                        <br>
                        thatway.ru@proton.me
                    </span>
                </div>
            </div>
        </aside>

        <!-- ===== Header (mobile) ===== -->
        <header class="mobile-header">
            <div class="mobile-logo">
                <svg width="78" height="49" viewBox="0 0 78 49" fill="none" xmlns="http://www.w3.org/2000/svg">
                    <use xlink:href="src/sprite.svg#logo-mobile"></use>
                </svg>
            </div>

            <div class="menu-button">
                <svg class="menu-button-icon icon-open menu-icon" xmlns="http://www.w3.org/2000/svg">
                    <use xlink:href="src/sprite.svg#menu-open"></use>
                </svg>

                <svg class="menu-button-icon icon-close menu-icon" xmlns="http://www.w3.org/2000/svg">
                    <use xlink:href="src/sprite.svg#menu-close"></use>
                </svg>
            </div>

            <div class="menu">
                <div class="menu-content">
                    <ul class="menu-navigation">
                        <script id="menu-nav-template" type="text/x-handlebars-template">
                            {{#each items}}
                            <li class="global-list-item menu-navigation-li {{cls}}">
                                <a class="global-link" href="{{href}}">
                                    <div class="menu-navigation-item">
                                        <div class="menu-navigation-icon">{{{icon}}}</div>
                                        <div class="divider"></div>
                                        <div class="menu-navigation-label">{{label}}</div>
                                    </div>
                                </a>
                            </li>
                            {{/each}}
                        </script>
                    </ul>

                    <div class="menu-socials-and-divider">
                        <hr class="menu-divider">
                        <ul class="menu-socials">
                            <li class="global-list-item menu-socials-item">
                                <a class="global-link menu-socials-link" href="#">
                                    <svg class="menu-socials-icon" viewBox="0 0 24 24" fill="none" xmlns="http://www.w3.org/2000/svg">
                                        <use xlink:href="src/sprite.svg#vk"></use>
                                    </svg>
                                </a>
                            </li>

                            <li class="global-list-item menu-socials-item">
                                <a class="global-link menu-socials-link" href="#">
                                    <svg class="menu-socials-icon" viewBox="0 0 31 24" fill="none" xmlns="http://www.w3.org/2000/svg">
                                        <use xlink:href="src/sprite.svg#discord"></use>
                                    </svg>
                                </a>
                            </li>

                            <li class="global-list-item menu-socials-item">
                                <a class="global-link menu-socials-link" href="#">
                                    <svg class="menu-socials-icon" viewBox="0 0 34 24" fill="none" xmlns="http://www.w3.org/2000/svg">
                                        <use xlink:href="src/sprite.svg#youtube"></use>
                                    </svg>
                                </a>
                            </li>

                            <li class="global-list-item menu-socials-item">
                                <a class="global-link menu-socials-link" href="#">
                                    <svg class="menu-socials-icon" viewBox="0 0 20 24" fill="none" xmlns="http://www.w3.org/2000/svg">
                                        <use xlink:href="src/sprite.svg#twitch"></use>
                                    </svg>
                                </a>
                            </li>
                        </ul>
                    </div>
                </div>
            </div>
        </header>

        <!-- ===== Main content (lore slider) ===== -->
        <main class="main">
            <div class="lore-slider embla" dir="ltr">
                <div class="embla-viewport">
                    <!-- было 9 слайдов, теперь пустой контейнер -->
                    <div class="embla-container" id="lore_slides"></div>
                </div>

                <script id="lore-slide-template" type="text/x-handlebars-template">
                    {{#each items}}
                    <div class="embla-slide">
                        <div class="main-content-wrapper">
                            <div class="main-content {{cls}}">
                                <div class="lore-info-wrapper">
                                    <div class="lore-info">
                                        <h1 class="lore-title">{{title}}</h1>
                                        <div class="lore-info-description {{#unless noScroll}} scroll-box{{/unless}}">
                                            {{#each paragraphs}}
                                            <p class="lore-text">{{this}}</p>
                                            {{/each}}
                                        </div>
                                    </div>
                                </div>
                                <div class="lore-images-wrapper">
                                    {{#if image}}<img class="lore-img global-img" src="public/img/{{image}}" alt="{{title}}" />{{/if}}
                                </div>
                            </div>
                        </div>
                    </div>
                    {{/each}}
                </script>

                <div class="embla-controls-wrapper">
                    <div class="embla-controls">
                        <!-- верхняя строка: кнопки + counter + title -->
                        <div class="embla-controls-row">

                            <!-- LEFT ZONE -->
                            <!--
                            <div class="embla-zone embla-zone-left">
                                <div class="embla-buttons">
                                    <button class="embla-button embla-button-prev" type="button">
                                        <svg xmlns="http://www.w3.org/2000/svg" width="32px" height="32px" viewBox="0 0 1024 1024" class="embla-button-svg" fill="#000000" transform="matrix(-1, 0, 0, 1, 0, 0)">
                                            <g id="SVGRepo_bgCarrier" stroke-width="0"/>
                                            <g id="SVGRepo_tracerCarrier" stroke-linecap="round" stroke-linejoin="round"/>
                                            <g id="SVGRepo_iconCarrier">
                                                <path fill="#000000" d="M340.864 149.312a30.592 30.592 0 000 42.752L652.736 512 340.864 831.872a30.592 30.592 0 000 42.752 29.12 29.12 0 0041.728 0L714.24 534.336a32 32 0 000-44.672L382.592 149.376a29.12 29.12 0 00-41.728 0z"/>
                                            </g>
                                        </svg>
                                    </button>
                                </div>
                            </div>
                            -->

                            <!-- CENTER ZONE -->
                            <div class="embla-zone embla-zone-center">
                                <div class="embla-counter">
                                    <span class="embla-counter-current">1</span> / <span class="embla-counter-total">3</span>
                                </div>
                                <!-- <div class="embla-title">Title</div> -->
                            </div>

                            <!-- RIGHT ZONE -->
                            <!--
                            <div class="embla-zone embla-zone-right">
                                <div class="embla-buttons">
                                    <button class="embla-button embla-button-next" type="button">
                                        <svg xmlns="http://www.w3.org/2000/svg" width="32px" height="32px" viewBox="0 0 1024 1024" class="embla-button-svg">
                                            <path fill="#000000" d="M340.864 149.312a30.592 30.592 0 000 42.752L652.736 512 340.864 831.872a30.592 30.592 0 000 42.752 29.12 29.12 0 0041.728 0L714.24 534.336a32 32 0 000-44.672L382.592 149.376a29.12 29.12 0 00-41.728 0z"/>
                                        </svg>
                                    </button>
                                </div>
                            </div>
                            -->

                        </div>
                        <div class="embla-dots"></div>
                    </div>
                </div>
            </div>
        </main>
    </div>

    <!-- ===== Scripts ===== -->
    <script src="https://unpkg.com/embla-carousel/embla-carousel.umd.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/handlebars@4.7.8/dist/handlebars.min.js"></script>
    <script src="src/js/sidebar_width.js"></script>
    <script src="src/js/toggle.js"></script>
    <script src="src/js/scroll_box.js"></script>
    <script src="src/js/slider.js"></script>
    <!-- <script src="src/js/first-word.js"></script> -->

    <script src="src/js/handlebars-data/mobile_menu_items_data.js"></script>
    <script>
        const tpl1 = Handlebars.compile(document.getElementById('menu-nav-template').innerHTML);
        document.querySelector('.menu-navigation').innerHTML = tpl1({ items: nav_items });
    </script>

    <script src="src/js/handlebars-data/lore-slides-data.js"></script>
    <script>
        const tpl2 = Handlebars.compile(document.getElementById('lore-slide-template').innerHTML);
        document.getElementById('lore_slides').innerHTML = tpl2({ items: lore_slides });
        // window.slideTitles = lore_slides.map(s => s.title);
    </script>
</body>
</html>
